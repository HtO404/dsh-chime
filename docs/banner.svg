<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#FBEEDB"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="250" rx="20" fill="url(#bg)"/>
  <circle cx="700" cy="40" r="90" fill="#FDE68A" opacity="0.25"/>
  <circle cx="90" cy="220" r="70" fill="#FCD34D" opacity="0.18"/>
  <circle cx="760" cy="210" r="24" fill="#F59E0B" opacity="0.12"/>

  <text x="400" y="98" text-anchor="middle" font-size="52" font-weight="800" fill="#1C1C1A">🔔 dsh-chime</text>
  <text x="400" y="140" text-anchor="middle" font-size="19" fill="#4A4A45">「任务跑完的那一刻，它替你喊一嗓子。」</text>
  <text x="400" y="168" text-anchor="middle" font-size="13" fill="#9A9A92">DSH Web GUI · 任务完成提示音插件 · 页面挂在后台也照常响</text>

  <g>
    <rect x="196" y="192" width="118" height="30" rx="15" fill="url(#chip)"/>
    <text x="255" y="211" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">后台也响</text>
    <rect x="332" y="192" width="118" height="30" rx="15" fill="url(#chip)"/>
    <text x="391" y="211" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">10 个预设音</text>
    <rect x="468" y="192" width="118" height="30" rx="15" fill="url(#chip)"/>
    <text x="527" y="211" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">一键换声</text>
  </g>
</svg>
